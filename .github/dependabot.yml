version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check for updates daily
    schedule:
      interval: "daily"
      # Check for updates at 7am UTC
      time: "07:00"
    # Labels on pull requests for version updates
    labels:
      - "dependencies"
      - "security"
    # Specify who should review when needed
    reviewers:
      - "boundlessdigital/developers"
    # Group all updates together
    groups:
      dependencies:
        patterns:
          - "*"
    # Set version update preferences
    versioning-strategy: auto
    # Raise pull requests for version updates
    pull-request-branch-name:
      # Separate sections of the branch name with a hyphen
      separator: "-"
    # Limit the number of open pull requests for version updates
    open-pull-requests-limit: 10
    # Allow up to 20 updates to npm dependencies
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Look for `.github/workflows` files in the `root` directory
    directory: "/"
    # Check for updates daily
    schedule:
      interval: "daily"
      time: "07:00"
    # Labels on pull requests for GitHub Actions
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
